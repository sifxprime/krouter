<!-- kRouter README lockup. Source of truth for images/krouter.png.

     The mark is the dashboard's echo chevron (src/shared/components/Sidebar.js)
     and the wordmark is Space Grotesk Bold with the site's -0.025em tracking,
     converted to outlines so this renders identically on any machine - the font
     is not installed system-wide and a text element would silently fall back.

     One deliberate difference from the UI: the echo stroke is 0.5 here, not
     0.35. At 0.35 the clay sits close enough to #0a0a0a to read as a smudge
     rather than a second chevron; on the dashboard's light ground the same
     value reads as a pale ghost. Same geometry, different background.

     Regenerate:  rsvg-convert -w 1814 images/krouter.svg -o images/krouter.png
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 907 360" width="907" height="360">
  <rect width="907" height="360" fill="#0a0a0a"/>
  <!-- Echo chevron: the dashboard's geometry, scaled from its 400-unit box. -->
  <g transform="translate(77,80) scale(0.5)" fill="none" stroke="#E56A4A" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="97.8,118 170,200 97.8,282" stroke-width="24" stroke-opacity="0.5"/>
    <polyline points="174,100 262,200 174,300" stroke-width="54"/>
  </g>
  <!-- Wordmark as outlines; the leading k carries the brand colour. -->
