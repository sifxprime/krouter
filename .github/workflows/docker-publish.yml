name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: sifxprime/krouter

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write # open an issue if a release build fails

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      # Docker Hub showed 6,459 pulls against an empty description. The npm README
      # is reused because its links are already absolute, minus the line telling
      # readers they are on npm. Non-fatal: a token scope problem here must not mark
      # an otherwise successful image push as failed.
      - name: Prepare Docker Hub README
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("cli/README.md", "utf8");
            const out = src.replace(
              /^> \*\*You.re viewing this on npm\.\*\*.*$/m,
              "> **You\u2019re viewing this on Docker Hub.** Full docs, screenshots, and changelog: [github.com/sifxprime/krouter](https://github.com/sifxprime/krouter)."
            );
            fs.writeFileSync("dockerhub-readme.md", out);
          '

      - name: Update Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Self-hosted AI gateway for Claude Code, Cursor, Codex & Copilot. 40+ providers, one endpoint."
          readme-filepath: ./dockerhub-readme.md

      # v0.5.158, v0.5.159 and v0.5.160 all failed here and nobody noticed for
      # weeks, because a tag-triggered workflow is one nobody is watching. An open
      # issue is hard to miss.
      - name: Open an issue if the release build failed
        if: failure() && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Docker image build failed for ${{ github.ref_name }}" \
            --label bug \
            --body "The Docker image for **${{ github.ref_name }}** did not build or push, so Docker Hub and GHCR still serve the previous image. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  github-release:
    # Independent of the image build: a Docker failure should not also withhold the
    # release notes from people installing through npm.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # 75 tags existed with zero GitHub Releases, so the repo sidebar read
      # "0 releases" next to 130 npm versions. Notes come from CHANGELOG.md, which is
      # written for humans; generated notes are the fallback.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 0
          fi
          awk -v tag="# $TAG " 'index($0, tag) == 1 { f = 1; next } f && /^# v[0-9]/ { exit } f' CHANGELOG.md > notes.md
          TITLE=$(grep -m1 "^# $TAG " CHANGELOG.md | sed 's/^# //')
          if [ -s notes.md ]; then
            gh release create "$TAG" --title "${TITLE:-$TAG}" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --latest
          fi
