name: Notify krouter-web on Release

# This dispatch is how a release reaches the website. It is not a nicety.
#
# krouter-web declares a "*/10 * * * *" cron as a fallback, but GitHub does not
# honour that on a free runner. Measured across 85 scheduled runs on that
# repository: the median gap between them is 212 minutes and the largest was 751.
# Only 2 of 84 gaps came in under an hour. So when this dispatch fails, a release
# does not reach the site "in ten minutes" — it waits hours.
#
# That is why a rejected dispatch fails the job. It is the difference between the
# website matching the release and silently lagging half a day behind it.

on:
  push:
    branches: ["main"]
  # So the token can be tested the moment it is rotated, without cutting a release.
  workflow_dispatch: {}

jobs:
  dispatch:
    name: Trigger krouter-web Sync and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to krouter-web
        env:
          TOKEN: ${{ secrets.KDL_ROUTER_WEB_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${TOKEN:-}" ]; then
            {
              echo "### krouter-web dispatch skipped — no token"
              echo
              echo "\`KDL_ROUTER_WEB_TOKEN\` is not set on this repository, so the website"
              echo "will not pick this release up until krouter-web's cron happens to run."
              echo "That cron is declared every 10 minutes but measures at a ~3.5 hour median."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::KDL_ROUTER_WEB_TOKEN is not set; the website will lag this release by hours."
            exit 1
          fi

          STATUS=$(curl -sS -o /tmp/dispatch-body.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sifxprime/krouter-web/dispatches \
            -d '{"event_type":"krouter-release"}')

          echo "Response status: $STATUS"

          if [ "$STATUS" = "204" ]; then
            echo "Dispatch accepted (204) - krouter-web is deploying now."
            echo "### krouter-web dispatch accepted" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Each status means a different thing, and the remedy differs. Saying
          # "403 usually means..." for all of them sends people to the wrong fix.
          case "$STATUS" in
            401) CAUSE="The token is invalid or has expired." ;;
            403) CAUSE="The token is valid but lacks permission to dispatch to krouter-web." ;;
            404) CAUSE="The token cannot see sifxprime/krouter-web at all - it has no access to the repository, or the name is wrong." ;;
            *)   CAUSE="Unexpected status $STATUS." ;;
          esac

          {
            echo "### krouter-web dispatch rejected - HTTP $STATUS"
            echo
            echo "$CAUSE"
            echo
            echo "**The website will lag this release.** krouter-web does sync this repository's"
            echo "CHANGELOG on a cron, but that cron is declared every 10 minutes and does not"
            echo "run anywhere near that often - measured across 85 scheduled runs, the median"
            echo "gap is 212 minutes and the largest was 751. This dispatch is what makes a"
            echo "release appear on the site promptly."
            echo
            echo "To fix, rotate \`KDL_ROUTER_WEB_TOKEN\` with a token that can dispatch:"
            echo
            echo "- **Classic PAT** - tick the \`repo\` scope. Nothing else is needed."
            echo "- **Fine-grained PAT** - grant it access to \`sifxprime/krouter-web\` and set"
            echo "  *Repository permissions -> Contents: Read and write*. Contents is the"
            echo "  permission the dispatch endpoint checks; Actions alone is not enough."
            echo
            echo "Set it at <https://github.com/sifxprime/krouter/settings/secrets/actions>,"
            echo "or with \`gh secret set KDL_ROUTER_WEB_TOKEN -R sifxprime/krouter\`."
            echo "Confirm the write landed - \`gh secret list -R sifxprime/krouter\` must show"
            echo "today's date against it, then re-run this workflow from the Actions tab."
            echo
            echo "<details><summary>Response body</summary>"
            echo
            echo '```json'
            head -c 800 /tmp/dispatch-body.txt || true
            echo
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::krouter-web dispatch rejected with HTTP $STATUS. $CAUSE Until it is fixed the website lags each release by hours, not minutes. See the job summary."
          exit 1
