name: Notify k‍router-web on Release

on:
  push:
    branches: ["main"]

jobs:
  dispatch:
    name: Trigger k‍router-web Sync and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to k‍router-web
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.KDL_ROUTER_WEB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/sifxprime/krouter-web/dispatches \
            -d '{"event_type":"krouter-release"}'  )
          echo "Response status: $STATUS"
          # `[ ... ] && echo || echo` always exits 0, so a rejected dispatch still
          # reported this job green. It has been failing with 403 on every release and
          # nothing said so -- the site only stayed current because krouter-web also
          # runs on a 10-minute cron. Fail loudly instead.
          if [ "$STATUS" != "204" ]; then
            echo "::error::repository_dispatch to krouter-web was rejected with HTTP $STATUS."
            echo "::error::403 usually means KDL_ROUTER_WEB_TOKEN lacks access to the private repo, or has expired."
            exit 1
          fi
          echo "Dispatch accepted (204)."
