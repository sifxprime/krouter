name: Publish to npm

# Publishes @sifxprime/krouter from CI on a version tag, using npm trusted publishing.
#
# Why from CI rather than a laptop:
# - No token and no OTP. GitHub proves its identity to npm over OIDC, so there is no
#   publish credential to store, paste, leak or rotate -- and the account's
#   "auth-and-writes" 2FA no longer blocks every release on a 30-second code.
# - Provenance. The package page shows which commit and workflow built it.
# - The build runs on a clean runner. Builds from the maintainer's machine embedded
#   their home directory (/Users/<name>/...) in 378 files of the published tarball.
#
# One-time setup on npmjs.com, which only the package owner can do:
#   @sifxprime/krouter -> Settings -> Trusted Publisher -> GitHub Actions
#   owner: sifxprime   repository: krouter   workflow: npm-publish.yml
# Fallback: an NPM_TOKEN repository secret (an npm granular token with publish
# rights on @sifxprime/krouter). npm tries trusted publishing first and uses the
# token only if that is refused, so setting both is safe; the token is never
# echoed. Set it without pasting it anywhere else:
#   gh secret set NPM_TOKEN -R sifxprime/krouter

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack only -- do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must exceed the serve gate's TIMEOUT_MINUTES plus the build, or GitHub
    # cancels the job mid-wait and the release reads as failed for the one reason
    # the gate exists to describe properly. 75m of waiting + ~10m of build, with
    # room to spare. A test pins the two together.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm with trusted-publishing support (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check version
        id: v
        run: |
          V=$(node -p "require('./cli/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cli/package.json version $V"
            exit 1
          fi
          if npm view "@sifxprime/krouter@$V" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@sifxprime/krouter@$V is already on npm -- nothing to publish."
          fi

      # npm logs why a trusted-publishing exchange failed only at verbose level, then
      # uploads without auth and reports a bare E404 -- which is all v0.5.161's
      # publish ever showed. This asks the registry directly, on dry runs too, and
      # prints the status, npm's message and the claims it matches against the
      # Trusted Publisher settings. Tokens are masked and never printed.
      - name: Check npm trusted publishing
        if: steps.v.outputs.already != 'true'
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No GitHub OIDC token available (id-token: write missing)"; exit 1
          fi
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$ID_TOKEN"
          echo "Claims npm compares with the Trusted Publisher settings:"
          printf '%s' "$ID_TOKEN" | node -e '
            let t = ""; process.stdin.on("data", (c) => (t += c)).on("end", () => {
              const c = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString());
              const keep = ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "environment", "ref", "event_name"];
              console.log(JSON.stringify(Object.fromEntries(keep.map((k) => [k, c[k] ?? null]))));
            });' || true
          PKG=$(node -p "require('./cli/package.json').name")
          ENC=$(node -p "process.argv[1].replace('/', '%2f')" "$PKG") # npm's own escapedName form
          code=$(curl -sS -o "$RUNNER_TEMP/oidc.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ID_TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ENC")
          msg=$(jq -r '.message // .error // empty' "$RUNNER_TEMP/oidc.json" 2>/dev/null)
          rm -f "$RUNNER_TEMP/oidc.json"
          if [ "$code" = "200" ] || [ "$code" = "201" ]; then
            echo "npm accepted this workflow as a trusted publisher of $PKG (HTTP $code)"
          else
            if [ "$HAS_NPM_TOKEN" = "true" ]; then
              echo "::warning::npm refused trusted publishing for $PKG (HTTP $code ${msg:-<no message>}); publishing with the NPM_TOKEN secret instead"
            else
              echo "::error::npm refused the trusted-publishing exchange for $PKG: HTTP $code ${msg:-<no message>}, and no NPM_TOKEN secret is set"
              exit 1
            fi
          fi

      - name: Install app dependencies
        if: steps.v.outputs.already != 'true'
        run: npm ci

      # Dev dependencies are needed: the build bundles the MITM server with esbuild.
      # Scripts are skipped so the CLI's postinstall does not warm a runtime cache
      # on a throwaway runner.
      - name: Install CLI dependencies
        if: steps.v.outputs.already != 'true'
        working-directory: cli
        run: npm ci --ignore-scripts

      # `npm pack` does not run the build -- only `prepublishOnly` does -- and cli/app
      # is not committed, so build it explicitly. Publishing the resulting tarball
      # skips lifecycle scripts, so nothing is built twice.
      - name: Build and pack
        if: steps.v.outputs.already != 'true'
        working-directory: cli
        run: |
          npm run sync-readme
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          ls -lh "$RUNNER_TEMP"/*.tgz

      - name: Verify the tarball
        if: steps.v.outputs.already != 'true'
        run: |
          TGZ=$(ls "$RUNNER_TEMP"/sifxprime-krouter-*.tgz)
          mkdir -p "$RUNNER_TEMP/inspect" && tar -xzf "$TGZ" -C "$RUNNER_TEMP/inspect"
          P="$RUNNER_TEMP/inspect/package"
          fail=0
          v=$(node -p "require('$P/package.json').version")
          [ "$v" = "${{ steps.v.outputs.version }}" ] || { echo "::error::tarball version $v"; fail=1; }
          [ -f "$P/app/node_modules/next/package.json" ] || { echo "::error::bundled Next.js runtime missing"; fail=1; }
          [ -f "$P/src/lib/dataDir.js" ] || { echo "::error::src/lib/dataDir.js missing"; fail=1; }
          # A package built on a developer's machine embeds that machine's home path
          # (e.g. /Users/<name>/...) in hundreds of compiled files. CI builds under
          # /home/runner, so that is the only home path allowed. node_modules is
          # third-party code installed from npm, not our build output; matching
          # /Users/ there and in our own help text (/Users/<user>/) gave false alarms.
          leaks=$(grep -rhoIE --exclude-dir=node_modules '/(Users|home)/[A-Za-z0-9._-]+/' "$P" \
            | grep -vxF '/home/runner/' | sort -u || true)
          if [ -n "$leaks" ]; then
            echo "::error::tarball contains a build machine's home path: $(echo $leaks)"
            grep -rlIE --exclude-dir=node_modules "$(echo "$leaks" | head -1)" "$P" | head -5 || true
            fail=1
          fi
          echo "files: $(find "$P" -type f | wc -l)   next: $(node -p "require('$P/app/node_modules/next/package.json').version")"
          exit $fail

      - name: Publish
        if: >-
          steps.v.outputs.already != 'true' &&
          (github.event_name == 'push' || inputs.dry_run == false)
        env:
          # Empty when the secret is unset, which leaves trusted publishing alone.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TGZ=$(ls "$RUNNER_TEMP"/sifxprime-krouter-*.tgz)

          # Output is captured as well as printed, because the one case worth
          # telling apart from a failure is only visible in npm's own message.
          set +e
          OUT=$(npm publish "$TGZ" --provenance --access public 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUT"

          if [ "$CODE" -ne 0 ]; then
            # npm holds a new publish in a staged state while it validates it. A
            # staged version is not served -- `npm view` 404s, so the "Check
            # version" step above reports it as unpublished -- but a second upload
            # of it is refused:
            #
            #   npm error code E409
            #   409 Conflict - PUT .../@sifxprime%2fkrouter
            #   Cannot publish over previously staged version "0.5.183".
            #
            # That is not a failed release, it is the previous attempt still in
            # flight, and failing on it is how v0.5.183's retry reported a publish
            # npm had in fact accepted. Matched on the code AND the wording AND
            # this run's version, so a 409 about anything else still fails.
            if printf '%s' "$OUT" | grep -q 'E409' && printf '%s' "$OUT" | grep -qF "previously staged version \"$VERSION\""; then
              echo "::notice::npm already holds $VERSION as a staged publish from an earlier attempt -- not republishing. The gate below decides whether it became installable."
            else
              echo "::error::npm publish failed. See 'Check npm trusted publishing' above for why npm refused, and the comment at the top of this workflow for the fix (Trusted Publisher, or an NPM_TOKEN secret)."
              exit 1
            fi
          fi

      # A green publish step does not mean the version can be installed.
      #
      # Every release of this package goes out through the NPM_TOKEN fallback (see
      # 'Check npm trusted publishing') and is staged: npm prints
      # `+ @sifxprime/krouter@x.y.z` with signed provenance, and then serves
      # nothing for a while. Measured here: 0.5.184 nine minutes, 0.5.186 seven,
      # 0.5.183 hours, and 0.5.185 was reported as released while `npm install`
      # still could not reach it. So success means "the registry serves it", not
      # "npm accepted the upload".
      #
      # The wait is deliberately long, because a tighter one would fail releases
      # that are merely slow and this job opens an issue when it fails.
      - name: Wait until npm actually serves the version
        if: >-
          steps.v.outputs.already != 'true' &&
          (github.event_name == 'push' || inputs.dry_run == false)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          # 75, because 0.5.187 took 55 minutes to be served after a green
          # publish. A 25m ceiling would have failed that release and opened an
          # issue for something that was fine half an hour later. The gate's job
          # is to prevent a false green, and waiting an hour still does that.
          TIMEOUT_MINUTES: "75"
        run: |
          URL="https://registry.npmjs.org/@sifxprime%2fkrouter/$VERSION"
          deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            # Cache-Control, because a CDN edge that answered 404 a moment ago
            # keeps answering 404 and reads as a far longer delay than there is.
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "npm is serving $VERSION (attempt $attempt)"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::npm accepted $VERSION but has not served it after ${TIMEOUT_MINUTES}m (last HTTP $code). It is staged, so npm install cannot reach it and a re-run is refused with E409 until it completes -- which this workflow now tolerates. Re-run this job to re-check without republishing; staging has resolved on its own before, sometimes after hours."
              exit 1
            fi
            sleep 20
          done

          # The dist-tag is a separate write, and it is what a bare
          # `npm i -g @sifxprime/krouter` resolves. Reported, not enforced:
          # publishing an older patch on purpose should not fail here.
          latest=$(curl -sS -H 'Cache-Control: no-cache' https://registry.npmjs.org/@sifxprime%2fkrouter | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d)["dist-tags"].latest)}catch{console.log("unknown")}})')
          if [ "$latest" = "$VERSION" ]; then
            echo "dist-tags.latest is $latest"
          else
            echo "::warning::$VERSION is served, but dist-tags.latest is $latest -- a plain install will not pick up this version."
          fi

  # A re-run that succeeds after a failed attempt left that attempt's issue open
  # (v0.5.162's #24). Close it, pointing at the run that published.
  close-failure-issue:
    needs: publish
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close a stale "npm publish failed" issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          title="npm publish failed for $TAG"
          for n in $(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number"); do
            gh issue close "$n" --repo "${{ github.repository }}" \
              --comment "Published by a later attempt: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

  # v0.5.161's publish failed (E404, no trusted publisher) while Docker and the
  # GitHub Release succeeded, and nothing said so -- the same silence that hid
  # three failed Docker releases. A failed tag publish now opens one issue. It is
  # a separate job so issues: write is never granted to the publish job, where
  # npm ci runs third-party install scripts.
  report-failure:
    needs: publish
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue if publishing failed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          title="npm publish failed for $TAG"
          if gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "An open issue already tracks this"; exit 0
          fi
          gh issue create --repo "${{ github.repository }}" --title "$title" --label bug \
            --body "**$TAG** is not installable from npm: \`npm install -g @sifxprime/krouter\` still gets the previous version. Two different things produce this, and the log says which. **(1) The upload never landed** -- an \`E404\` on \`PUT\` means the npm Trusted Publisher for @sifxprime/krouter is missing or does not match (user \`sifxprime\`, repository \`krouter\`, workflow \`npm-publish.yml\`, no environment); fix it on npmjs.com, then re-run the failed job. **(2) The upload landed and npm has not served it** -- if the last step timed out waiting, npm accepted the version and is holding it staged; nothing is lost and nothing needs republishing, a retry is refused with \`E409 Cannot publish over previously staged version\` which this workflow tolerates, so just re-run the failed job to re-check. Staging has taken from seven minutes to several hours here, and it keeps happening because every release goes out through the \`NPM_TOKEN\` fallback rather than trusted publishing. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
